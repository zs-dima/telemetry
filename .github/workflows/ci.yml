name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "bin/**"
      - "lib/**"
      - "test/**"
      - "example/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "justfile"
      - "mise.toml"
      - "dart_test.yaml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "bin/**"
      - "lib/**"
      - "test/**"
      - "example/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "justfile"
      - "mise.toml"
      - "dart_test.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # One recipe for every package repository, pinned to a tag (zs-dima/dev_tool). It resolves,
    # checks formatting, runs `dart analyze`, `dart test` and `dart pub publish --dry-run`.
    uses: zs-dima/dev_tool/.github/workflows/dart-package.yml@v1

  # What the shared recipe cannot cover. Analysis is not compilation, and `dart test` is the VM
  # only, so `lib/src/console/delegate_js.dart` reaches a compiler and a browser nowhere else.
  web:
    name: Compile · Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      # `just` from mise.toml.
      - name: Setup just
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Compile the example to JS and to Wasm
        run: just compile-check

      # Chrome is on the runner image.
      - name: Browser tests
        run: just test-web
