# ignore: prefer-publish-to-none, this package is published.
name: telemetry
description: One event model for every telemetry channel (console, journal, crash reporting, toasts, analytics), with sinks the application supplies.

version: 0.3.5

homepage: https://github.com/zs-dima/telemetry
repository: https://github.com/zs-dima/telemetry
issue_tracker: https://github.com/zs-dima/telemetry/issues

topics:
  - logging
  - telemetry
  - opentelemetry
  - sentry
  - observability

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.13.2

dependencies:
  # Annotations only. The engine is pure Dart, so it runs in an isolate, in a CLI
  # and under `dart test`, with no Flutter binding.
  meta: ^1.16.0

dev_dependencies:
  # `package:test` rather than `flutter_test`: the engine is pure Dart, and its tests run the same way.
  test: ^1.25.0

  lints_tool: ^1.0.1
